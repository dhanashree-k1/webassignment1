<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Signup Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
     
     
    }

    body {
      height: 100vh;
      background: linear-gradient(to right, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      color: black;
    }

    .container {
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px);
      width: 350px;
      border: black;
      border: 2px solid black;
      background-color: white
   
    }

    .form {
      display: none;
      flex-direction: column;
      gap: 15px;
    }

    .form.active {
      display: flex;
      color: crimson;
    }

    .form h2 {
      text-align: center;
    }

    .form input {
      padding: 10px;
      border: none;
      border-radius: 5px;
      outline: none;
      border: 2px solid black ;
    }

    .form button {
      padding: 10px;
      background: crimson;
      border: none;
      border-radius: 5px;
      color: black;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .form button:hover {
      background: crimson;
    }

    .toggle {
      text-align: center;
      margin-top: 20px;
      color:crimson;
      
    }

    .toggle a {
      color: black;
      text-decoration: underline;
      cursor: pointer;
      color:crimson;
      
    }

    #google-signin {
      margin: 10px auto;
      text-align: center;
    }

    .divider {
      text-align: center;
      margin: 10px 0;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Form -->
    <form class="form active" id="loginForm">
      <h2>Login</h2>
      <h3>HEALTHY DIET RECOMENDOR</h3>
      <input type="email" placeholder="Email" required />
      <input type="password" placeholder="Password" required />
      <button type="submit">Login</button>
      <div class="divider">OR</div>
      <!-- Google Sign-In -->
      <div id="google-signin-login"></div>
      <div class="toggle">
        Don't have an account? <a onclick="toggleForms()">Sign up</a>
      </div>
    </form>

    <!-- Signup Form -->
    <form class="form" id="signupForm">
      <h2>Sign Up</h2>
      <input type="text" placeholder="Name" required />
      <input type="email" placeholder="Email" required />
      <input type="password" placeholder="Password" required />
      <button type="submit">Sign Up</button>
      <div class="divider">OR</div>
      <!-- Google Sign-In -->
      <div id="google-signin-signup"></div>
      <div class="toggle">
        Already have an account? <a onclick="toggleForms()">Login</a>
      </div>
    </form>
  </div>

  <script>
    function toggleForms() {
      const loginForm = document.getElementById("loginForm");
      const signupForm = document.getElementById("signupForm");
      loginForm.classList.toggle("active");
      signupForm.classList.toggle("active");
    }

    function handleCredentialResponse(response) {
      const data = parseJwt(response.credential);
      console.log("Google User:", data);
      alert("Signed in as: " + data.name);
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(decodeURIComponent(atob(base64).split('').map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
    }

    // Google Sign-In Button Config
    window.onload = () => {
      google.accounts.id.initialize({
        client_id: "YOUR_GOOGLE_CLIENT_ID_HERE",
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("google-signin-login"),
        { theme: "outline", size: "large" }
      );

      google.accounts.id.renderButton(
        document.getElementById("google-signin-signup"),
        { theme: "outline", size: "large" }
      );
    };

    // Simple Form Submit (example only)
    document.querySelectorAll("form").forEach(form => {
      form.addEventListener("submit", e => {
        e.preventDefault();
        alert("Form submitted!");
      });
    });
  </script>
</body>
</html>
